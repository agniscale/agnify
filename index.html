<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Agnify - Coming Soon</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --neon-blue: #00f3ff;
            --neon-pink: #ff00c1;
            --dark-bg: #0a0a0a;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #0a0a0a 0%, #1a1a2e 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            overflow: hidden;
        }

        .animated-bg {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -2;
            background: linear-gradient(-45deg, #0a0a0a, #1a1a2e, #16213e, #0f3460);
            background-size: 400% 400%;
            animation: gradient 15s ease infinite;
        }

        @keyframes gradient {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        .container {
            max-width: 1200px;
            width: 100%;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 60px;
            align-items: center;
        }

        .content-section {
            animation: slideInLeft 0.8s ease-out;
        }

        @keyframes slideInLeft {
            from {
                opacity: 0;
                transform: translateX(-50px);
            }
            to {
                opacity: 1;
                transform: translateX(0);
            }
        }

        h1 {
            font-size: 3.5rem;
            color: #fff;
            margin-bottom: 20px;
            font-weight: 900;
            text-shadow: 0 0 20px var(--neon-blue);
            letter-spacing: -1px;
            background: linear-gradient(135deg, #fff, var(--neon-blue));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .glitch-text {
            position: relative;
            display: inline-block;
        }

        .glitch {
            position: relative;
        }

        .glitch::before,
        .glitch::after {
            content: attr(data-text);
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: var(--dark-bg);
        }

        .glitch::before {
            left: 2px;
            text-shadow: -1px 0 var(--neon-pink);
            clip: rect(44px, 450px, 56px, 0);
            animation: glitch-anim 5s infinite linear alternate-reverse;
        }

        .glitch::after {
            left: -2px;
            text-shadow: -1px 0 var(--neon-blue);
            clip: rect(44px, 450px, 56px, 0);
            animation: glitch-anim2 5s infinite linear alternate-reverse;
        }

        @keyframes glitch-anim {
            0% { clip: rect(15px, 9999px, 81px, 0); }
            5% { clip: rect(72px, 9999px, 24px, 0); }
            10% { clip: rect(4px, 9999px, 88px, 0); }
            15% { clip: rect(66px, 9999px, 14px, 0); }
            20% { clip: rect(25px, 9999px, 96px, 0); }
            100% { clip: rect(50px, 9999px, 50px, 0); }
        }

        @keyframes glitch-anim2 {
            0% { clip: rect(80px, 9999px, 4px, 0); }
            5% { clip: rect(30px, 9999px, 100px, 0); }
            10% { clip: rect(10px, 9999px, 20px, 0); }
            100% { clip: rect(90px, 9999px, 90px, 0); }
        }

        .tagline {
            font-size: 1.3rem;
            color: var(--neon-blue);
            margin-bottom: 30px;
            font-weight: 300;
            letter-spacing: 3px;
            text-transform: uppercase;
        }

        .description {
            font-size: 1.1rem;
            color: rgba(255, 255, 255, 0.7);
            line-height: 1.8;
            margin-bottom: 40px;
        }

        .features-list {
            display: flex;
            flex-direction: column;
            gap: 15px;
            margin-bottom: 40px;
        }

        .feature {
            display: flex;
            align-items: center;
            gap: 15px;
            padding: 15px;
            background: rgba(0, 243, 255, 0.05);
            border-left: 2px solid var(--neon-blue);
            border-radius: 5px;
            transition: all 0.3s ease;
        }

        .feature:hover {
            background: rgba(0, 243, 255, 0.15);
            transform: translateX(10px);
            box-shadow: 0 0 15px rgba(0, 243, 255, 0.3);
        }

        .feature-icon {
            font-size: 1.5rem;
            color: var(--neon-blue);
        }

        .feature-text {
            color: rgba(255, 255, 255, 0.8);
        }

        .cta-buttons {
            display: flex;
            gap: 15px;
            margin-bottom: 30px;
        }

        .btn {
            padding: 15px 35px;
            border: none;
            border-radius: 5px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            text-decoration: none;
            display: inline-block;
            text-transform: uppercase;
            letter-spacing: 1px;
            position: relative;
            overflow: hidden;
        }

        .btn::before {
            content: "";
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: var(--neon-blue);
            z-index: -1;
            transition: left 0.3s ease;
        }

        .btn-primary {
            background: var(--neon-blue);
            color: #000;
            box-shadow: 0 0 20px rgba(0, 243, 255, 0.5);
            border: 2px solid var(--neon-blue);
        }

        .btn-primary:hover {
            transform: translateY(-3px);
            box-shadow: 0 0 40px rgba(0, 243, 255, 0.8);
            text-shadow: 0 0 10px rgba(0, 243, 255, 0.5);
        }

        .btn-secondary {
            background: transparent;
            color: var(--neon-blue);
            border: 2px solid var(--neon-blue);
            box-shadow: 0 0 15px rgba(0, 243, 255, 0.3);
        }

        .btn-secondary:hover {
            background: var(--neon-blue);
            color: #000;
            transform: translateY(-3px);
            box-shadow: 0 0 30px rgba(0, 243, 255, 0.6);
        }

        .owner-info {
            font-size: 0.95rem;
            color: var(--neon-blue);
        }

        /* Card Section */
        .card-container {
            display: flex;
            justify-content: center;
            align-items: center;
            perspective: 1200px;
            animation: slideInRight 0.8s ease-out;
        }

        @keyframes slideInRight {
            from {
                opacity: 0;
                transform: translateX(50px);
            }
            to {
                opacity: 1;
                transform: translateX(0);
            }
        }

        .card-wrapper {
            position: relative;
            width: 320px;
            height: 480px;
        }

        .mouse-position-tracker {
            position: absolute;
            width: 33.333%;
            height: 33.333%;
            z-index: 10;
            cursor: pointer;
        }

        .tr-1 {
            top: 0;
            left: 0;
        }
        .tr-2 {
            top: 0;
            left: 33.333%;
        }
        .tr-3 {
            top: 0;
            left: 66.666%;
        }
        .tr-4 {
            top: 33.333%;
            left: 0;
        }
        .tr-5 {
            top: 33.333%;
            left: 33.333%;
        }
        .tr-6 {
            top: 33.333%;
            left: 66.666%;
        }
        .tr-7 {
            top: 66.666%;
            left: 0;
        }
        .tr-8 {
            top: 66.666%;
            left: 33.333%;
        }
        .tr-9 {
            top: 66.666%;
            left: 66.666%;
        }

        .card {
            position: absolute;
            inset: 0;
            background: rgba(10, 10, 10, 0.8);
            border: 1px solid rgba(0, 243, 255, 0.3);
            border-radius: 20px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            transition:
                transform 0.2s ease-out,
                box-shadow 0.2s ease;
            transform-style: preserve-3d;
            box-shadow: 0 0 15px rgba(0, 243, 255, 0.2);
            overflow: hidden;
            backdrop-filter: blur(10px);
        }

        .card::before {
            content: "";
            position: absolute;
            inset: 0;
            background: linear-gradient(rgba(0, 243, 255, 0.1) 1px, transparent 1px),
                linear-gradient(90deg, rgba(0, 243, 255, 0.1) 1px, transparent 1px);
            background-size: 30px 30px;
            opacity: 0.5;
            mask-image: radial-gradient(circle at center, white, transparent 80%);
            z-index: 1;
            pointer-events: none;
        }

        .card::after {
            content: "";
            position: absolute;
            width: 200%;
            height: 200%;
            background: radial-gradient(
                circle at center,
                rgba(0, 243, 255, 0.2),
                transparent 50%
            );
            top: -50%;
            left: -50%;
            opacity: 0;
            transition: 0.3s;
            z-index: 0;
            pointer-events: none;
        }

        .content {
            z-index: 5;
            transform: translateZ(40px);
            text-align: center;
            pointer-events: none;
        }

        .title {
            font-size: 3.5rem;
            font-weight: 900;
            color: #fff;
            text-shadow: 0 0 10px rgba(0, 243, 255, 0.7);
            line-height: 1;
            position: relative;
            mix-blend-mode: lighten;
        }

        .subtitle {
            margin-top: 10px;
            color: var(--neon-blue);
            letter-spacing: 3px;
            font-size: 0.8rem;
            text-transform: uppercase;
        }

        .hud-corner {
            position: absolute;
            width: 20px;
            height: 20px;
            border: 2px solid var(--neon-blue);
            transition: 0.3s;
            z-index: 4;
        }
        .tl {
            top: 20px;
            left: 20px;
            border-right: none;
            border-bottom: none;
        }
        .tr {
            top: 20px;
            right: 20px;
            border-left: none;
            border-bottom: none;
        }
        .bl {
            bottom: 20px;
            left: 20px;
            border-right: none;
            border-top: none;
        }
        .br {
            bottom: 20px;
            right: 20px;
            border-left: none;
            border-top: none;
        }

        .tr-1:hover ~ .card {
            transform: rotateX(20deg) rotateY(-20deg);
        }
        .tr-1:hover ~ .card::after {
            opacity: 1;
            transform: translate(-20%, -20%);
        }

        .tr-2:hover ~ .card {
            transform: rotateX(20deg) rotateY(0deg);
        }
        .tr-2:hover ~ .card::after {
            opacity: 1;
            transform: translate(0%, -20%);
        }

        .tr-3:hover ~ .card {
            transform: rotateX(20deg) rotateY(20deg);
        }
        .tr-3:hover ~ .card::after {
            opacity: 1;
            transform: translate(20%, -20%);
        }

        .tr-4:hover ~ .card {
            transform: rotateX(0deg) rotateY(-20deg);
        }
        .tr-4:hover ~ .card::after {
            opacity: 1;
            transform: translate(-20%, 0%);
        }

        .tr-5:hover ~ .card {
            transform: rotateX(0deg) rotateY(0deg) scale(1.05);
            box-shadow: 0 0 30px var(--neon-blue);
        }
        .tr-5:hover ~ .card::after {
            opacity: 1;
            transform: translate(0%, 0%);
        }

        .tr-6:hover ~ .card {
            transform: rotateX(0deg) rotateY(20deg);
        }
        .tr-6:hover ~ .card::after {
            opacity: 1;
            transform: translate(20%, 0%);
        }

        .tr-7:hover ~ .card {
            transform: rotateX(-20deg) rotateY(-20deg);
        }
        .tr-7:hover ~ .card::after {
            opacity: 1;
            transform: translate(-20%, 20%);
        }

        .tr-8:hover ~ .card {
            transform: rotateX(-20deg) rotateY(0deg);
        }
        .tr-8:hover ~ .card::after {
            opacity: 1;
            transform: translate(0%, 20%);
        }

        .tr-9:hover ~ .card {
            transform: rotateX(-20deg) rotateY(20deg);
        }
        .tr-9:hover ~ .card::after {
            opacity: 1;
            transform: translate(20%, 20%);
        }

        .card-wrapper:hover .hud-corner {
            box-shadow: 0 0 10px var(--neon-blue);
            width: 30px;
            height: 30px;
        }

        @media (max-width: 1024px) {
            .container {
                grid-template-columns: 1fr;
                gap: 40px;
            }

            h1 {
                font-size: 2.5rem;
            }

            .card-wrapper {
                width: 280px;
                height: 420px;
            }

            .title {
                font-size: 2.5rem;
            }
        }

        @media (max-width: 768px) {
            .container {
                grid-template-columns: 1fr;
            }

            h1 {
                font-size: 2rem;
            }

            .tagline {
                font-size: 1rem;
            }

            .cta-buttons {
                flex-direction: column;
            }

            .btn {
                width: 100%;
                text-align: center;
            }

            .card-wrapper {
                width: 250px;
                height: 380px;
            }

            .title {
                font-size: 2rem;
            }
        }
    </style>
</head>
<body>
    <div class="animated-bg"></div>

    <div class="container">
        <div class="content-section">
            <h1><span class="glitch" data-text="AGNIFY">AGNIFY</span></h1>
            <p class="tagline">Next Generation Experience</p>

            <p class="description">
                Step into the future with cutting-edge technology and innovative solutions designed for the modern world.
            </p>

            <div class="features-list">
                <div class="feature">
                    <span class="feature-icon">⚡</span>
                    <span class="feature-text">Lightning Fast Performance</span>
                </div>
                <div class="feature">
                    <span class="feature-icon">🔒</span>
                    <span class="feature-text">Military-Grade Security</span>
                </div>
                <div class="feature">
                    <span class="feature-icon">🚀</span>
                    <span class="feature-text">Advanced Innovation</span>
                </div>
                <div class="feature">
                    <span class="feature-icon">✨</span>
                    <span class="feature-text">Beautiful Interface</span>
                </div>
            </div>

            <div class="cta-buttons">
                <button class="btn btn-primary">Notify Me</button>
                <button class="btn btn-secondary">Learn More</button>
            </div>

            <p class="owner-info">👤 Created by <strong>Shaina KK</strong></p>
        </div>

        <div class="card-container">
            <div class="card-wrapper">
                <div class="mouse-position-tracker tr-1"></div>
                <div class="mouse-position-tracker tr-2"></div>
                <div class="mouse-position-tracker tr-3"></div>
                <div class="mouse-position-tracker tr-4"></div>
                <div class="mouse-position-tracker tr-5"></div>
                <div class="mouse-position-tracker tr-6"></div>
                <div class="mouse-position-tracker tr-7"></div>
                <div class="mouse-position-tracker tr-8"></div>
                <div class="mouse-position-tracker tr-9"></div>

                <div class="card">
                    <div class="hud-corner tl"></div>
                    <div class="hud-corner tr"></div>
                    <div class="hud-corner bl"></div>
                    <div class="hud-corner br"></div>

                    <div class="content">
                        <div class="title glitch" data-text="AGNIFY">AGNIFY</div>
                        <div class="subtitle">Coming Soon</div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        // Ensure HTTPS
        if (window.location.protocol !== 'https:' && window.location.hostname !== 'localhost') {
            window.location.protocol = 'https:';
        }

        // Button interactions
        const notifyBtn = document.querySelector('.btn-primary');
        const learnBtn = document.querySelector('.btn-secondary');

        notifyBtn.addEventListener('click', () => {
            alert('Thank you for your interest! We will notify you when we launch.');
        });

        learnBtn.addEventListener('click', () => {
            alert('More information coming soon!');
        });
    </script>
</body>
</html>
